<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMX Class Manager - Multi-Select Example</title>
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <script src="../dist/class-manager.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .item {
            padding: 30px;
            background: white;
            border: 3px solid #ddd;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .item.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
            transform: scale(1.05);
        }
        
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body hx-ext="class-manager">
    <h1>Multi-Select Example</h1>
    <p>Select multiple items at once using class-manager extension.</p>
    
    <div>
        <button hx-get="/api/select?ids=1,3,5" hx-swap="none">Select Odd</button>
        <button hx-get="/api/select?ids=2,4" hx-swap="none">Select Even</button>
        <button hx-get="/api/deselect" hx-swap="none">Deselect All</button>
    </div>
    
    <div class="grid">
        <div class="item" id="item-1">Item 1</div>
        <div class="item" id="item-2">Item 2</div>
        <div class="item" id="item-3">Item 3</div>
        <div class="item" id="item-4">Item 4</div>
        <div class="item" id="item-5">Item 5</div>
    </div>
    
    <h3>How it works:</h3>
    <p>Server builds a selector string for multiple items:</p>
    <pre><code>selectors = '#item-1:selected|#item-3:selected|#item-5:selected'
&lt;div class-add="{selectors}"&gt;&lt;/div&gt;</code></pre>
    
    <script>
        // Mock server responses
        document.body.addEventListener('htmx:configRequest', function(evt) {
            evt.preventDefault();
            
            const url = evt.detail.path;
            let response;
            
            if (url.includes('/select')) {
                const ids = url.match(/ids=([^&]+)/)?.[1].split(',') || [];
                const selectors = ids.map(id => `#item-${id}:selected`).join('|');
                response = `<div class-add="${selectors}"></div>`;
            } else {
                response = '<div class-remove=".item:selected"></div>';
            }
            
            setTimeout(() => {
                htmx.trigger(document.body, 'htmx:beforeSwap', {
                    xhr: { responseText: response },
                    target: document.body
                });
            }, 100);
        });
    </script>
</body>
</html>
